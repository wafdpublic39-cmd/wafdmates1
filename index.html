<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wafd Mates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f6f5ee;--card:#fcfcf7;--soft:#e4ebd0;--ink:#2b3022;--mid:#68704f;--acc:#6b7f3a;--line:#dcdfc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f15;--card:#242a1b;--soft:#2c3422;--ink:#eef0e0;--mid:#a9b48a;--acc:#a8c25a;--line:#3a4229}}
:root[data-theme="dark"]{--bg:#1b1f15;--card:#242a1b;--soft:#2c3422;--ink:#eef0e0;--mid:#a9b48a;--acc:#a8c25a;--line:#3a4229}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,"Segoe UI",Arial,sans-serif;line-height:1.6}
h1,h2,h3,.logo,.big{font-family:Poppins,"Segoe UI",Arial,sans-serif;font-weight:800;letter-spacing:-.02em}
nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:20px 6vw}
.logo{font-weight:700;font-size:22px;letter-spacing:.5px}
.logo span{color:var(--acc)}
nav a{color:var(--ink);text-decoration:none;margin-left:22px;font-size:15px;font-weight:600;padding-bottom:3px}
nav a:hover{color:var(--acc)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:4vh 6vw 8vh;min-height:70vh}
.tag{display:inline-block;border:1px solid var(--acc);color:var(--acc);padding:4px 14px;border-radius:6px;font-size:13px;margin-bottom:18px}
h1{font-size:clamp(40px,6.4vw,84px);line-height:1;margin:0 0 20px;letter-spacing:-1px}
h1 em{color:var(--acc);font-style:normal}
.lead{font-size:19px;color:var(--mid);max-width:480px;margin:0 0 28px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:13px 28px;border-radius:10px;text-decoration:none;border:0;font:inherit;cursor:pointer;font-size:16px}
.btn:hover{background:var(--acc)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink);margin-left:8px}
.marq{overflow:hidden;border-block:1px solid var(--line);padding:14px 0;background:var(--card)}
.marq div{display:flex;gap:48px;white-space:nowrap;width:max-content;animation:m 28s linear infinite;font-size:22px;font-weight:800;color:var(--mid)}
@keyframes m{to{transform:translateX(-50%)}}
section{padding:8vh 6vw}
h2{font-size:clamp(28px,4vw,46px);margin:0 0 8px}
.sub{color:var(--mid);margin:0 0 32px}
.gal{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.gal figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;max-width:100%}
.gal img{width:100%;display:block;border-radius:8px}
.gal figcaption{padding:8px 4px 2px;font-size:14px;color:var(--mid)}
.empty{color:var(--mid);font-style:italic;border:1px dashed var(--line);padding:28px;border-radius:14px}
form.contact{max-width:560px;display:grid;gap:12px}
input,textarea{font:inherit;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:100%}
textarea{min-height:120px;resize:vertical}
.note{font-size:14px;color:var(--mid);min-height:20px}
footer{text-align:center;padding:30px;color:var(--mid);font-size:14px;border-top:1px solid var(--line)}
/* admin */
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);padding:32px;border-radius:18px;display:grid;gap:12px}
.login h2{margin:0}
.adm{padding:20px 6vw 8vh}
.adm .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:20px 0}
.msg{border-bottom:1px solid var(--line);padding:12px 0}
.msg:last-child{border:0}
.msg b{display:block}
.msg small{color:var(--mid)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.wk{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;flex-wrap:wrap}
.wk img{width:90px;height:70px;object-fit:cover;border-radius:8px}
.wk input[type=range]{width:180px;padding:0}
.wk input[type=text]{width:180px}
.sm{padding:7px 14px;font-size:13px}
.tab[hidden]{display:none!important}
nav a.on{color:var(--acc);border-bottom:3px solid var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card h3{margin:8px 0;font-size:20px}
.card p{margin:0;color:var(--mid);font-size:15px}
.big{font-size:42px;color:var(--acc)}
a.card{display:block;color:inherit;text-decoration:none}
.qh{font-size:24px;margin:34px 0 8px}
.qual{max-width:760px;padding:0;list-style:none;counter-reset:q;margin:0}
.qual li{counter-increment:q;display:flex;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-size:18px}
.qual li::before{content:counter(q);font-family:"Poppins",Poppins,sans-serif;color:var(--acc);font-size:26px;min-width:36px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.chip{padding:8px 18px;border:1px solid var(--ink);border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo svg{height:46px;width:46px;display:block}
.logo img{height:46px;width:auto;max-width:220px;display:block}
.logo .wm{color:var(--ink)}
.logo .wm span{color:var(--acc)}
.about{max-width:760px;font-size:19px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.stage{max-width:320px}nav a{margin:0 14px 0 0}}
.stage{position:relative;aspect-ratio:1;max-width:460px;width:100%;margin:auto;user-select:none}
.ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line);animation:spin 40s linear infinite}
.ring.r2{inset:12%;animation-duration:26s;animation-direction:reverse;border-color:var(--mid);opacity:.5}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--acc);top:-8px;left:calc(50% - 8px)}
.ring.r2 .dot{background:var(--ink);top:auto;bottom:-8px}
.orb{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a9bd68,var(--acc) 55%,#3f4d1e);display:flex;align-items:center;justify-content:center;gap:14%;box-shadow:0 20px 50px rgba(60,75,30,.35);animation:float 4s ease-in-out infinite}
.eye{width:22%;aspect-ratio:1;background:#f6f5ee;border-radius:50%;position:relative}
.eye i{position:absolute;width:48%;height:48%;background:#2b3022;border-radius:50%;top:26%;left:26%;transition:transform .08s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-12px)}}
.eyebrow{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600;margin-bottom:10px}
.depth{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin:auto;--mx:0;--my:0}
.layer{position:absolute;top:0;left:0;right:36px;bottom:36px;border-radius:20px;transition:transform .18s ease-out}
.l3{background:var(--soft);transform:translate(calc(var(--mx)*-26px + 36px),calc(var(--my)*-26px + 36px))}
.l2{background:var(--acc);opacity:.85;transform:translate(calc(var(--mx)*-14px + 18px),calc(var(--my)*-14px + 18px))}
.l1{background:var(--card);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:space-between;transform:translate(calc(var(--mx)*10px),calc(var(--my)*10px));box-shadow:0 18px 40px rgba(43,48,34,.14)}
.l1 small{color:var(--acc);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.l1 strong{font-size:clamp(28px,4vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.l1 span{color:var(--mid);font-size:14px}
.soft{background:var(--soft)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px;margin-top:28px}
.steps b{color:var(--acc);font-size:14px}
.steps h3{margin:6px 0;font-size:20px}
.steps p{margin:0;color:var(--mid);font-size:15px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:28px}
.feat img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.cta{background:var(--acc);color:var(--bg);text-align:center}
.cta p{max-width:520px;margin:8px auto 24px;opacity:.92}
.btn.light{background:var(--bg);color:var(--ink)}
details{border-bottom:1px solid var(--line);padding:14px 0;max-width:680px}
summary{cursor:pointer;font-weight:600}
details p{color:var(--mid);margin:8px 0 0}
.logo .deflogo{height:58px;width:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .deflogo{filter:brightness(0) invert(.92)}}
:root[data-theme="dark"] .deflogo{filter:brightness(0) invert(.92)}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 20px;max-width:560px;margin:24px auto 10px}
.person{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 14px 20px;position:relative;overflow:hidden;animation:rise .5s ease both;transition:transform .25s,box-shadow .25s,border-color .25s}
.person::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.person:hover{transform:translateY(-8px);box-shadow:0 18px 36px rgba(43,48,34,.16);border-color:var(--acc)}
.person:hover::before{transform:scaleX(1)}
.person img,.person .ph{transition:transform .3s,border-color .3s}
.person:hover img,.person:hover .ph{transform:scale(1.06);border-color:var(--acc)}
.person:nth-child(even){animation-delay:.1s}
.person:nth-child(n+3){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.person img,.person .ph{width:130px;height:130px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:34px;font-weight:800;color:var(--acc)}
.person b{display:block}
.person.lead{background:var(--acc);border-color:var(--acc);color:var(--bg);box-shadow:0 14px 30px rgba(43,48,34,.2)}
.person.lead b{color:var(--bg)}
.lds{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--ink)}
.person.lead img,.person.lead .ph{width:150px;height:150px;border-color:var(--bg)}
.person.lead .ph{background:var(--bg);color:var(--acc)}
.person.lead:hover img,.person.lead:hover .ph{border-color:var(--bg)}
.person.lead small{background:var(--bg);color:var(--acc)}
.person small{display:inline-block;background:var(--soft);color:var(--acc);font-weight:600;padding:3px 12px;border-radius:99px;font-size:12px}
.person.slot{background:transparent;border:2px dashed var(--line);box-shadow:none}
.person.slot:hover{transform:none;box-shadow:none;border-color:var(--line)}
.person.slot .ph{color:var(--mid)}
.people.wide{max-width:none;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.people .person{padding:0;border:0;border-radius:26px;overflow:hidden;aspect-ratio:4/5;background:var(--soft);text-align:left;box-shadow:0 12px 32px rgba(43,48,34,.16)}
.people .person::before{display:none}
.people .person::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(to top,rgba(22,28,12,.88),rgba(22,28,12,0));pointer-events:none}
.people .person img,.people .person .ph{position:absolute;inset:0;width:100%;height:100%;border-radius:0;border:0;margin:0;object-fit:cover;transition:transform .5s ease}
.people .person .ph{font-size:76px;background:linear-gradient(145deg,var(--soft),var(--acc));color:#fff;opacity:.95}
.people .person:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 22px 44px rgba(43,48,34,.28)}
.people .person:hover img,.people .person:hover .ph{transform:scale(1.08);border:0}
.people .person b,.people .person small{position:absolute;left:16px;z-index:2;color:#fff}
.people .person b{bottom:46px;right:12px;font-size:17px;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.people .person small{bottom:16px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px 13px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.02em}
.people .person.lead{outline:3px solid var(--acc);outline-offset:3px;background:var(--soft)}
.people .person.lead b{color:#fff}
.people .person.lead img,.people .person.lead .ph{width:100%;height:100%;border:0}
.people .person.lead small{background:var(--acc);color:#fff}
.people .person.slot{background:transparent;border:2px dashed var(--line);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;outline:0}
.people .person.slot::after{display:none}
.people .person.slot:hover{transform:none;box-shadow:none}
.people .person.slot .ph{position:static;width:78px;height:78px;border-radius:50%;font-size:30px;background:var(--soft);color:var(--mid);display:flex;align-items:center;justify-content:center}
.people .person.slot b,.people .person.slot small{position:static;color:var(--ink);text-shadow:none;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;text-align:center}
.people .person.slot small{color:var(--mid);font-weight:400}
.people.wide.small{grid-template-columns:repeat(auto-fit,minmax(120px,150px));justify-content:start;gap:16px}
.people.small .person{border-radius:20px}
.people.small .person b{font-size:14px;bottom:38px}
.people.small .person small{font-size:11px;padding:3px 10px;bottom:12px}
.people.small .person .ph{font-size:48px}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
const app=$('#app');
let db=null,assets=null,me=null,works=[],msgs=[],people=[],loggedIn=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let curHub='';const HUBDESC={literature:'Reading circles, writing, poetry and storytelling for every kind of reader.',intellectual:'Debates, talks and discussions for curious, critical minds.',creative:'Art, design, music and film — a space to make and show new work.',public:'Open events and outreach that connect the union with the wider community.'};
let view='',filter='';const CATS={literature:'Literature Hub',intellectual:'Intellectual Hub',creative:'Creative Hub',public:'Public Hub'};
function route(){
  const h=location.hash.slice(1)||'home';
    if(view!=='home'){view='home';renderHome()}
  let t=h;
  if(h.startsWith('hub-')){const q=h.slice(4).split('-'),c=q[0];curHub=(c in CATS)?c:'';curClub=q.slice(1).join('-');t='hubs'}else if(h==='hubs'){curHub='';curClub=''}
  paintPeople();
  if(h.startsWith('work')){filter=h.split('-')[1]||'';t='work';paintGallery()}
  showTab(['home','about','hubs','work','contact'].includes(t)?t:'home');
}
function showTab(t){
  document.querySelectorAll('.tab').forEach(e=>e.hidden=e.dataset.tab!==t);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+t));
  scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- HOME ---------- */
function renderHome(){
  app.innerHTML=`
  <nav><div class="logo" id="fl" onclick="location.hash='home'"></div><div><a href="#home">Home</a><a href="#about">About</a><a href="#hubs">Hubs</a><a href="#work">Gallery</a><a href="#contact">Contact</a></div></nav>
  <header class="hero tab" data-tab="home">
    <div>
      <span class="tag">● Welcome to the union</span>
      <h1>Four hubs. One <em>union.</em></h1>
      <p class="lead">A home for readers, thinkers, makers and the public — bringing minds together.</p>
      <a class="btn" href="#hubs">Explore the hubs</a><a class="btn ghost" href="#contact">Contact us</a>
    </div>
    <div class="stage" id="stage"><div class="ring"><div class="dot"></div></div><div class="ring r2"><div class="dot"></div></div><div class="orb"><div class="eye"><i></i></div><div class="eye"><i></i></div></div></div>
  </header>
  <div class="marq tab" data-tab="home"><div id="mq"></div></div>
  <section class="tab" data-tab="home" id="comm"></section>
  <section class="tab" data-tab="home"><span class="eyebrow">Our hubs</span><h2>Four places to belong</h2><p class="sub">Pick a hub to see what’s happening.</p><div class="cards"><a class="card" href="#hub-literature"><div class="big">01</div><h3>Literature Hub</h3><p>Reading circles, writing, poetry and storytelling for every kind of reader.</p></a><a class="card" href="#hub-intellectual"><div class="big">02</div><h3>Intellectual Hub</h3><p>Debates, talks and discussions for curious, critical minds.</p></a><a class="card" href="#hub-creative"><div class="big">03</div><h3>Creative Hub</h3><p>Art, design, music and film — a space to make and show new work.</p></a><a class="card" href="#hub-public"><div class="big">04</div><h3>Public Hub</h3><p>Open events and outreach that connect the union with the wider community.</p></a></div></section>
  <section class="tab soft" data-tab="home"><span class="eyebrow">What we do</span><h2>What happens in the hubs</h2><div class="steps"><div><b>01</b><h3>Read &amp; write</h3><p>Stories, poetry and reading in the Literature Hub.</p></div><div><b>02</b><h3>Think &amp; debate</h3><p>Talks and discussions in the Intellectual Hub.</p></div><div><b>03</b><h3>Make &amp; create</h3><p>Art, design and new work in the Creative Hub.</p></div><div><b>04</b><h3>Share</h3><p>Open events and outreach in the Public Hub.</p></div></div></section>
  <section class="tab" data-tab="home"><span class="eyebrow">Latest</span><h2>From the hubs</h2><p class="sub">Fresh posts from our members.</p><div class="feat" id="feat"></div><a class="btn" href="#work">See the gallery</a></section>
  <section class="tab cta" data-tab="home"><h2>Have a question or an idea?</h2><p>Send us a message and the union team will get back to you.</p><a class="btn light" href="#contact">Contact us</a></section>
  <section class="tab" data-tab="about"><h2>About the union</h2><p class="sub">Who we are.</p><p class="about"><strong style="display:block;font-size:clamp(22px,3vw,30px);line-height:1.2;margin-bottom:10px">One Batch. One Vision. One Brotherhood.</strong>Rooted in knowledge, united by purpose and inspired to make a difference. We are the 39th Batch of Darul Huda named Wafd Mates.</p><h3 class="qh">What we stand for</h3><ol class="qual"><li><span><b>Open to all</b> — everyone has a voice here.</span></li><li><span><b>Curiosity</b> — we ask questions and follow ideas.</span></li><li><span><b>Creativity</b> — we make things worth sharing.</span></li><li><span><b>Community</b> — we grow by working together.</span></li><li><span><b>Integrity</b> — we say what we mean and do what we say.</span></li></ol></section>
  <section class="tab" data-tab="hubs"><div id="hubintro"><div id="unionlead"></div><h2>Our hubs</h2><p class="sub">Four hubs, one union. Choose a hub to meet its members.</p><div class="cards"><a class="card" href="#hub-literature"><div class="big">01</div><h3>Literature Hub</h3><p>Reading circles, writing, poetry and storytelling for every kind of reader.</p><p><b>See members →</b></p></a><a class="card" href="#hub-intellectual"><div class="big">02</div><h3>Intellectual Hub</h3><p>Debates, talks and discussions for curious, critical minds.</p><p><b>See members →</b></p></a><a class="card" href="#hub-creative"><div class="big">03</div><h3>Creative Hub</h3><p>Art, design, music and film — a space to make and show new work.</p><p><b>See members →</b></p></a><a class="card" href="#hub-public"><div class="big">04</div><h3>Public Hub</h3><p>Open events and outreach that connect the union with the wider community.</p><p><b>See members →</b></p></a></div></div><div id="ppl"></div></section>
  <section class="tab" data-tab="work" id="work"><h2>Gallery</h2><p class="sub">Posts and works from across the hubs.</p><div class="chips" id="chips"></div><div class="gal" id="gal"></div></section>
  <section class="tab" data-tab="contact" id="contact"><h2>Get in touch</h2><p class="sub">Send us a message — it goes straight to the union team.</p>
    <form class="contact" id="cf">
      <input name="name" placeholder="Your name" required>
      <input name="email" type="email" placeholder="Your email" required>
      <textarea name="text" placeholder="Your message" required></textarea>
      <button class="btn" type="submit">Send message</button><div class="note" id="note"></div>
    </form>
    <h3 class="qh">Questions</h3>
    <details><summary>How do I contact the union team?</summary><p>Use the form above. Your message goes straight to the team.</p></details>
    <details><summary>Where can I see the latest posts?</summary><p>In the Gallery tab. You can filter it by hub.</p></details>
    <details><summary>How can I share my work?</summary><p>Message us, and our team can add your post to the gallery under the right hub.</p></details>
    </section>
  <footer>© Wafd Mates</footer>
`;
  const words=['Literature','Ideas','Creativity','Community','Debate','Stories','Art','Public'];
  $('#mq').innerHTML=[...words,...words].map(w=>`<span>${w}</span>`).join('');
  const eyes=[...document.querySelectorAll('.eye')];
  document.onmousemove=e=>eyes.forEach(el=>{const r=el.getBoundingClientRect(),a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));el.firstChild.style.transform=`translate(${Math.cos(a)*30}%,${Math.sin(a)*30}%)`});
  paintLogo();paintGallery();paintPeople();
  $('#cf').onsubmit=async ev=>{
    ev.preventDefault();const f=ev.target,n=$('#note'),C=window.CONFIG||{};
    if(C.formEndpoint){
      try{const r=await fetch(C.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name:f.name.value,email:f.email.value,message:f.text.value})});if(!r.ok)throw 0;f.reset();n.textContent='Thanks! Your message was sent ✓'}
      catch(e){n.textContent='Could not send right now. Please try again.'}
      return;
    }
    if(C.contactEmail){location.href='mailto:'+C.contactEmail+'?subject='+encodeURIComponent('Message from '+f.name.value)+'&body='+encodeURIComponent(f.text.value+'\n\n'+f.name.value+' ('+f.email.value+')');n.textContent='Opening your email app…';return}
    n.textContent='Contact is not set up yet.';
  };
}
function paintGallery(){
  const g=$('#gal');if(!g)return;
  const fw=$('#feat');if(fw)fw.innerHTML=works.length?works.slice(0,3).map(w=>`<img src="${w.img}" alt="${esc(w.title||'work')}">`).join(''):'<div class="empty">New posts are on the way.</div>';
  const list=filter?works.filter(w=>w.cat===filter):works;
  const ch=$('#chips');if(ch)ch.innerHTML=[['','All'],...Object.entries(CATS)].map(([k,v])=>`<a class="chip${k===filter?' on':''}" href="#work${k?'-'+k:''}">${esc(v)}</a>`).join('');
  g.innerHTML=list.length?list.map(w=>`<figure style="width:${w.size||260}px"><img src="${w.img}" alt="${esc(w.title||'work')}">${w.title?`<figcaption>${esc(w.title)}</figcaption>`:''}</figure>`).join(''):'<div class="empty">Posts coming soon — check back shortly.</div>';
}

function paintAdmin(){
  const wl=$('#wl'),ml=$('#ml');if(!wl)return;
  wl.innerHTML=works.length?works.map(w=>`<div class="wk"><img src="${w.img}" alt=""><input type="text" value="${esc(w.title||'')}" data-t="${w.id}" placeholder="Title"><select data-c="${w.id}" style="padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit"><option value=""${!w.cat?' selected':''}>Uncategorised</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${w.cat===k?' selected':''}>${esc(v)}</option>`).join('')}</select><label>Size <input type="range" min="120" max="700" step="10" value="${w.size||260}" data-s="${w.id}"> <span id="v${w.id}">${w.size||260}px</span></label><button class="btn sm ghost" data-d="${w.id}">Delete</button></div>`).join(''):'<div class="empty">No works yet. Upload a PNG above.</div>';
  wl.querySelectorAll('[data-s]').forEach(r=>{r.oninput=()=>$('#v'+r.dataset.s).textContent=r.value+'px';r.onchange=()=>db&&db.collection('works').doc(r.dataset.s).update({size:+r.value})});
  wl.querySelectorAll('[data-t]').forEach(i=>i.onchange=()=>db&&db.collection('works').doc(i.dataset.t).update({title:i.value}));
  wl.querySelectorAll('[data-c]').forEach(s=>s.onchange=()=>db&&db.collection('works').doc(s.dataset.c).update({cat:s.value}));
  wl.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(!db)return;if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Tap again to confirm';setTimeout(()=>{if(b.isConnected){b.dataset.arm='';b.textContent='Delete'}},4000);return}b.textContent='Deleting…';db.collection('works').doc(b.dataset.d).delete().catch(()=>{b.textContent='Failed'})});
  ml.innerHTML=msgs.length?msgs.map(m=>`<div class="msg"><b>${esc(m.name)} · ${esc(m.email)}</b><small>${new Date(m.at).toLocaleString()}</small><p>${esc(m.text)}</p><button class="btn sm ghost" data-m="${m.uid}|${m.at}">Delete</button></div>`).join(''):'<div class="empty">No messages yet.</div>';
  ml.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{
    if(!db){b.textContent='Not connected';return}
    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Tap again to confirm';setTimeout(()=>{if(b.isConnected){b.dataset.arm='';b.textContent='Delete'}},4000);return}
    b.disabled=true;b.textContent='Deleting…';
    const [uid,at]=b.dataset.m.split('|');const ref=db.collection('messages').doc(uid);
    try{const cur=await ref.get();const list=((cur.exists&&cur.data().list)||[]).filter(m=>String(m.at)!==at);
      if(list.length)await ref.set({list});else await ref.delete();
      msgs=msgs.filter(m=>!(m.uid===uid&&String(m.at)===at));paintAdmin()}
    catch(e){b.disabled=false;b.dataset.arm='';b.textContent='Failed: '+((e&&(e.code||e.message))||'not allowed')}
  });
}
async function uploadWorks(){
  const n=$('#un'),files=[...$('#fi').files];
  if(!assets||!db){n.textContent='Uploads need you to be signed in as the page owner.';return}
  if(!files.length){n.textContent='Choose a PNG first.';return}
  try{
    for(const f of files){
      n.textContent='Uploading '+f.name+'…';
      const a=await assets.upload(f);
      await db.collection('works').doc('w'+Date.now()+Math.floor(Math.random()*99)).set({asset:a.id,title:$('#ti').value,cat:$('#ci').value,size:260,at:Date.now()});
    }
    n.textContent='Uploaded ✓';$('#fi').value='';$('#ti').value='';
  }catch(e){n.textContent='Upload failed: '+(e&&e.message||'try again')}
}

async function addPerson(){
  const n=$('#pnote'),f=$('#pf').files[0],name=$('#pn').value.trim();
  if(!assets||!db){n.textContent='Uploads need you to be signed in as the page owner.';return}
  if(!name){n.textContent='Enter a name.';return}
  try{n.textContent='Uploading…';let asset='';if(f){const a=await assets.upload(f);asset=a.id}
    await db.collection('people').doc('p'+Date.now()+Math.floor(Math.random()*99)).set({name,role:$('#pr').value.trim(),club:$('#pc').value.trim(),hub:$('#ph').value,asset,at:Date.now()});
    n.textContent='Added ✓';['#pf','#pn','#pr'].forEach(i=>$(i).value='')}
  catch(e){n.textContent='Failed: '+((e&&(e.code||e.message))||'try again')}
}
const HUBCLUBS={literature:[['urdu-hindi','Urdu & Hindi Club'],['arabic','Arabic Club'],['malayalam','Malayalam Club'],['english','English Club']],intellectual:[['maths','Maths Club'],['science','Science Club'],['gk','GK Club']],creative:[['art','Art Club'],['pkv','PKV Club'],['media','Media Club'],['outreach','Outreach Club']],public:[['sports','Sports Club'],['health','Health Club'],['iic','IIC Club'],['library','Library Club']]};let curClub='';const SLOTS={library:['Chairman'],outreach:['Chairman','Convenor','Convenor']};
function clubsHTML(list,card,hub){
  const own=HUBCLUBS[hub]||[],pre=[['leadership','Hub'],...own],norm=x=>x.trim().toLowerCase().replace(/&/g,'and').replace(/\s+/g,' ');
  const alias=new Map([[norm('Hub Chairman & Convenor'),'Hub'],...pre.map(([k,n])=>[norm(n),n])]),keyOf=new Map(pre.map(([k,n])=>[n,k]));
  const g=new Map(pre.map(([k,n])=>[n,[]]));
  [...list].sort((a,b)=>(a.at||0)-(b.at||0)).forEach(p=>{const raw=(p.club||'').trim(),c=alias.get(norm(raw))||raw||'Hub';if(!g.has(c))g.set(c,[]);g.get(c).push(p)});
  const slot=t=>`<div class="person slot"><div class="ph">?</div><b>${t}</b><small>Not added yet</small></div>`;
  const block=(title,arr,named,key)=>{
    const s=[...arr].sort((a,b)=>rk(a)-rk(b));
    const chs=s.filter(p=>rk(p)===0),cvs=s.filter(p=>rk(p)===1),used=new Set();
    const cells=named?(SLOTS[key]||['Chairman','Convenor']).map(r=>{const q=(r==='Chairman'?chs:cvs).find(p=>!used.has(p));if(q){used.add(q);return card(q)}return slot(r)}):[];
    const oth=s.filter(p=>!used.has(p)).map(card);
    return `<h3 class="qh">${esc(title)}</h3><div class="people">${[...cells,...oth].join('')}</div>`;
  };
  const chips=own.length?`<div class="chips"><a class="chip${curClub?'':' on'}" href="#hub-${hub}">All clubs</a>${pre.map(([k,n])=>`<a class="chip${curClub===k?' on':''}" href="#hub-${hub}-${k}">${esc(n)}</a>`).join('')}</div>`:'';
  const shown=[...g].filter(([c])=>c&&(!curClub||keyOf.get(c)===curClub));
  return chips+shown.map(([c,a])=>block(c,a,true,keyOf.get(c))).join('')+((!curClub&&g.has(''))?block('Members',g.get(''),false):'');
}
function auditHTML(card){
  const a=people.filter(p=>p.hub==='union'&&/audit/i.test(p.role||''));
  const cells=a.map(card);while(cells.length<2)cells.push('<div class="person slot"><div class="ph">?</div><b>Auditor</b><small>Not added yet</small></div>');
  return `<div style="height:36px"></div><span class="eyebrow">Auditing</span><h2>Auditing team</h2><p class="sub">The two auditors of Wafd Mates.</p><div class="people wide small">${cells.join('')}</div>`;
}
const OFFICE=['President','Secretary','Vice President','Program Secretary','Treasurer'];
function committeeHTML(card){
  const u=people.filter(p=>p.hub==='union'&&!/audit/i.test(p.role||'')),used=new Set();
  const cells=OFFICE.map(r=>{const q=u.find(p=>(p.role||'').trim().toLowerCase()===r.toLowerCase()&&!used.has(p));if(q){used.add(q);return card(q)}return `<div class="person slot"><div class="ph">?</div><b>${r}</b><small>Not added yet</small></div>`});
  const oth=u.filter(p=>!used.has(p)).map(card);
  return `<span class="eyebrow">Union committee</span><h2>The office bearers</h2><p class="sub">The five office bearers of Wafd Mates.</p><div class="people wide">${[...cells,...oth].join('')}</div>`;
}
function rk(p){const r=(p.role||'').toLowerCase();if(/vice|joint|assistant/.test(r))return 2;return /chair/.test(r)?0:/convenor|convener/.test(r)?1:2}
function paintPeople(){
  const card=p=>`<div class="person${p.hub==='union'?' lead':''}">${p.asset?`<img src="${p.img}" alt="${esc(p.name)}">`:`<div class="ph">${esc((p.name||'?')[0].toUpperCase())}</div>`}<b>${esc(p.name)}</b>${p.role?`<small>${esc(p.role)}</small>`:''}</div>`;
  const pub=$('#ppl');
  const ul=$('#unionlead');if(ul)ul.innerHTML='';
  const cm=$('#comm');if(cm)cm.innerHTML=committeeHTML(card)+auditHTML(card);
  const hi=$('#hubintro');if(hi)hi.hidden=!!curHub;
  if(pub){
    if(curHub){const ld=[],rest=people.filter(p=>p.hub===curHub).sort((a,b)=>rk(a)-rk(b));pub.innerHTML=`<div class="chips">${Object.entries(CATS).map(([k,v])=>`<a class="chip${k===curHub?' on':''}" href="#hub-${k}">${esc(v)}</a>`).join('')}</div><h2 style="margin-top:18px">${esc(CATS[curHub])}</h2><p class="sub">${esc(HUBDESC[curHub])}</p>`+clubsHTML(rest,card,curHub)}
    else pub.innerHTML=''
  }
  const pl=$('#pl');
  if(pl){
    const dl=$('#cl');if(dl)dl.innerHTML=[...new Set(['Hub',...Object.values(HUBCLUBS).flat().map(c=>c[1]),...people.map(p=>p.club).filter(Boolean)])].map(c=>`<option value="${esc(c)}">`).join('');
    pl.innerHTML=people.length?[...people].sort((a,b)=>((a.hub==='union'?0:1)-(b.hub==='union'?0:1))||rk(a)-rk(b)).map(p=>`<div class="wk">${p.asset?`<img src="${p.img}" alt="" style="width:60px;height:60px;border-radius:50%">`:''}<b>${esc(p.name)}</b><span>${esc(p.role||'')}${p.club?' ('+esc(p.club)+')':''} · ${esc(p.hub==='union'?'Union (overall)':(CATS[p.hub]||''))}</span><button class="btn sm ghost" data-pd="${p.id}">Delete</button></div>`).join(''):'<div class="empty">No people added yet.</div>';
    pl.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{if(!db)return;if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Tap again to confirm';setTimeout(()=>{if(b.isConnected){b.dataset.arm='';b.textContent='Delete'}},4000);return}b.textContent='Deleting…';db.collection('people').doc(b.dataset.pd).delete().catch(()=>{b.textContent='Failed'})});
  }
}

/* ---------- DATA ---------- */
people=(window.PEOPLE||[]).map((p,i)=>({id:'p'+i,asset:'',...p})).sort((a,b)=>b.at-a.at);
works=(window.WORKS||[]).map((w,i)=>({id:'w'+i,size:260,...w})).sort((a,b)=>b.at-a.at);
route();
</script>
